<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3">
  <meta name="description" content="Huelab: learn colour theory with a hex-driven colour wheel, short lessons, a layered painting area and practical assignments.">
  <title>Huelab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Huelab home">
      <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
        <path d="M20 4a16 16 0 0 1 13.9 8L20 20z" fill="#E8742C"/><path d="M33.9 12A16 16 0 0 1 33.9 28L20 20z" fill="#F2D21A"/>
        <path d="M33.9 28A16 16 0 0 1 20 36L20 20z" fill="#3E9B5B"/><path d="M20 36A16 16 0 0 1 6.1 28L20 20z" fill="#2F5FA8"/>
        <path d="M6.1 28A16 16 0 0 1 6.1 12L20 20z" fill="#7B4FA8"/><path d="M6.1 12A16 16 0 0 1 20 4L20 20z" fill="#C8372D"/>
        <circle cx="20" cy="20" r="6" fill="var(--card, #fff)"/>
      </svg>
      <span>Huelab</span>
    </a>
    <nav class="nav-top" id="navTop" aria-label="Main"></nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="nav-bottom" id="navBottom" aria-label="Main"></nav>

  <!-- Brush texture filters used by the painting area (see js/paint.js) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="globalDefs"></defs></svg>

  <dialog id="dlg" aria-labelledby="dlgTitle"><div id="dlgBody"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/color.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/state.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
